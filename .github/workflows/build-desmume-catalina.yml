name: Build DeSmuME Catalina Debug Bundle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone and patch pinned DeSmuME source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release_0_9_13 \
            https://github.com/TASEmulators/desmume.git /tmp/desmume
          python3 scripts/patch-desmume-catalina.py /tmp/desmume
      - name: Discover Xcode project and dev+ scheme
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/desmume -name '*.xcodeproj' -print > /tmp/xcode-projects.txt
          : > /tmp/xcode-discovery.txt
          : > /tmp/desmume-selection.env
          while IFS= read -r project; do
            echo "===== $project =====" | tee -a /tmp/xcode-discovery.txt
            listing="$(xcodebuild -project "$project" -list 2>&1)"
            printf '%s\n' "$listing" | tee -a /tmp/xcode-discovery.txt
            scheme="$(printf '%s\n' "$listing" | sed -n '/Schemes:/,$p' | grep -E 'dev\+|Dev\+' | sed 's/^[[:space:]]*//' | head -n1 || true)"
            if [[ -n "$scheme" && ! -s /tmp/desmume-selection.env ]]; then
              printf 'PROJECT=%q\nSCHEME=%q\n' "$project" "$scheme" > /tmp/desmume-selection.env
            fi
          done < /tmp/xcode-projects.txt
          if [[ ! -s /tmp/desmume-selection.env ]]; then
            echo 'No DeSmuME dev+ scheme discovered' >&2
            exit 1
          fi
          cat /tmp/desmume-selection.env
      - name: Build Intel dev+ application for Catalina
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/desmume-selection.env
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath /tmp/desmume-derived \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=10.15 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/desmume-build.log
      - name: Assemble and inspect Catalina bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$(find /tmp/desmume-derived -type d -name 'DeSmuME*.app' | head -n1)"
          test -n "$app"
          root=/tmp/desmume-catalina-debug
          mkdir -p "$root"
          cp -R "$app" "$root/DeSmuME Debug.app"
          cat > "$root/run-desmume-debug.command" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          if [[ $# -ne 2 ]]; then
            echo "usage: $0 /absolute/path/to/game.nds ARM9_GDB_PORT" >&2
            exit 64
          fi
          app_dir="$(cd "$(dirname "$0")" && pwd)"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_dir/DeSmuME Debug.app/Contents/Info.plist")"
          exec env RE_MCP_ARM9_GDB_PORT="$2" \
            "$app_dir/DeSmuME Debug.app/Contents/MacOS/$executable" "$1"
          SCRIPT
          chmod +x "$root/run-desmume-debug.command"
          binary="$(find "$root/DeSmuME Debug.app/Contents/MacOS" -type f -perm +111 | head -n1)"
          file "$binary" | tee /tmp/desmume-binary.txt
          lipo -archs "$binary" | tee /tmp/desmume-architectures.txt
          otool -l "$binary" | awk '/LC_BUILD_VERSION/{flag=1} flag{print} /sdk/{if(flag){exit}}' | tee /tmp/desmume-minos.txt
          grep -R -q 'RE_MCP_ARM9_GDB_PORT' /tmp/desmume/desmume/src/frontend/cocoa/userinterface/appDelegate.mm
          printf '%s\n' \
            'Intel x86_64 DeSmuME dev+ build targeting macOS 10.15.' \
            'The launcher automatically starts the ARM9 GDB stub.' \
            'Use RE-MCP desmume_start with mode macos-cocoa.' \
            > "$root/README.txt"
          ditto -c -k --sequesterRsrc --keepParent "$root" /tmp/desmume-catalina-debug.zip
          shasum -a 256 /tmp/desmume-catalina-debug.zip > /tmp/desmume-catalina-debug.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: desmume-catalina-debug-bundle
          path: |
            /tmp/desmume-catalina-debug.zip
            /tmp/desmume-catalina-debug.zip.sha256
            /tmp/xcode-discovery.txt
            /tmp/desmume-build.log
            /tmp/desmume-binary.txt
            /tmp/desmume-architectures.txt
            /tmp/desmume-minos.txt
          if-no-files-found: error
          retention-days: 30
