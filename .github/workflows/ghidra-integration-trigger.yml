name: Temporary Ghidra Acceptance Trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ghidra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and verify RE-MCP
        run: |
          set -euo pipefail
          npm install
          npm run check
          npm run build
          node --check scripts/ghidra-acceptance.mjs

      - name: Download and verify Ghidra 12.1.2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghidra_12.1.2_PUBLIC_20260605.zip"
          url="https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip"
          expected="b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d"
          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/ghidra_12.1.2_PUBLIC/support/analyzeHeadless"

      - name: Run real Ghidra bridge acceptance
        shell: bash
        env:
          RE_MCP_GHIDRA_TIMEOUT_MS: '900000'
          RE_MCP_MAX_OUTPUT_BYTES: '1000000'
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/re-mcp-ghidra-workspace"
          mkdir -p "$workspace"
          RE_MCP_WORKSPACE_ROOT="$workspace" \
          RE_MCP_GHIDRA_HOME="$RUNNER_TEMP/ghidra_12.1.2_PUBLIC" \
          node scripts/ghidra-acceptance.mjs "$workspace" fixture.nds

      - name: Dump ARM9 memory blocks after acceptance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/re-mcp-ghidra-workspace"
          project_root="$(find "$workspace/analysis/ghidra/nds" -mindepth 2 -maxdepth 2 -type d -name project -print -quit 2>/dev/null || true)"
          if [[ -z "$project_root" ]]; then
            echo "No Ghidra project root available for diagnostics"
            exit 0
          fi
          sha="$(basename "$(dirname "$project_root")")"
          project_name="RE-MCP-$sha"
          diag="$RUNNER_TEMP/re-mcp-ghidra-diagnostics"
          mkdir -p "$diag"
          cat > "$diag/DumpBlocks.java" <<'JAVA'
          // @category RE-MCP Acceptance
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.mem.MemoryBlock;
          public class DumpBlocks extends GhidraScript {
              @Override
              protected void run() throws Exception {
                  println("PROGRAM=" + currentProgram.getName());
                  for (MemoryBlock block : currentProgram.getMemory().getBlocks()) {
                      println("BLOCK=" + block.getName()
                          + " overlay=" + block.isOverlay()
                          + " space=" + block.getStart().getAddressSpace().getName()
                          + " start=" + block.getStart()
                          + " size=" + block.getSize());
                  }
              }
          }
          JAVA
          "$RUNNER_TEMP/ghidra_12.1.2_PUBLIC/support/analyzeHeadless" \
            "$project_root" "$project_name" \
            -process RE-MCP_ARM9 \
            -noanalysis \
            -scriptPath "$diag" \
            -postScript DumpBlocks.java
