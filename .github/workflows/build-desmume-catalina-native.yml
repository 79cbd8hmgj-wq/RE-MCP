name: Build Catalina-Native DeSmuME Debug Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned DeSmuME source and apply patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release_0_9_13 \
            https://github.com/TASEmulators/desmume.git /tmp/desmume
          git -C /tmp/desmume rev-parse HEAD | tee /tmp/desmume-source-commit.txt
          python3 scripts/patch-desmume-catalina-native.py /tmp/desmume
          grep -q 'RE_MCP_ARM9_GDB_PORT' \
            /tmp/desmume/desmume/src/frontend/cocoa/userinterface/appDelegate.mm
          grep -q 'RE_MCP_FORCE_OPENGL' \
            /tmp/desmume/desmume/src/frontend/cocoa/DeSmuME_Prefix.pch

      - name: Select Intel64 Xcode project and dev+ scheme
        shell: bash
        run: |
          set -euo pipefail
          project="/tmp/desmume/desmume/src/frontend/cocoa/DeSmuME (Latest).xcodeproj"
          scheme="DeSmuME (macOS App; Intel64 dev+ -- Latest Xcode)"

          if [[ ! -d "$project" ]]; then
            echo "Expected DeSmuME Xcode project was not found: $project" >&2
            exit 1
          fi

          listing="$(xcodebuild -project "$project" -list 2>&1)"
          printf '%s\n' "$listing" | tee /tmp/xcode-discovery.txt
          if ! printf '%s\n' "$listing" | grep -Fq "        $scheme"; then
            echo "Expected Intel64 dev+ scheme was not found: $scheme" >&2
            exit 1
          fi

          printf 'PROJECT=%q\nSCHEME=%q\n' "$project" "$scheme" \
            | tee /tmp/desmume-selection.env

      - name: Build Intel Cocoa application for Catalina with OpenGL
        shell: bash
        run: |
          set -uo pipefail
          source /tmp/desmume-selection.env
          set +e
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath /tmp/desmume-derived \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=10.15 \
            CODE_SIGNING_ALLOWED=NO \
            EXCLUDED_SOURCE_FILE_NAMES=MacMetalDisplayView.mm \
            build 2>&1 | tee /tmp/desmume-build.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 ]]; then
            grep -nE '(^|[[:space:]])(error:|fatal error:)|Undefined symbols|symbol\(s\) not found|BUILD FAILED|CompileC|Ld ' \
              /tmp/desmume-build.log | tail -n 300 | tee /tmp/desmume-build-errors.txt || true
            exit "$status"
          fi

          if grep -Eq 'CompileC .*MacMetalDisplayView\.mm|CompileC.*MacMetalDisplayView' \
            /tmp/desmume-build.log; then
            echo 'MacMetalDisplayView.mm was still compiled despite exclusion' >&2
            exit 1
          fi

          if grep -Eq 'MacMetalDisplayView::|MacMetalDisplayPresenter::|MacMetalFetchObject::' \
            /tmp/desmume-build.log; then
            echo 'Metal frontend symbols remained in the OpenGL-only build' >&2
            exit 1
          fi

      - name: Assemble and validate Catalina-native bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$(find /tmp/desmume-derived -type d -name 'DeSmuME*.app' | head -n1)"
          test -n "$app"

          root=/tmp/desmume-catalina-native-debug
          rm -rf "$root"
          mkdir -p "$root"
          cp -R "$app" "$root/DeSmuME Debug.app"

          plist="$root/DeSmuME Debug.app/Contents/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          binary="$root/DeSmuME Debug.app/Contents/MacOS/$executable"
          test -x "$binary"

          cat > "$root/run-desmume-debug.command" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          if [[ $# -ne 2 ]]; then
            echo "usage: $0 /absolute/path/to/game.nds ARM9_GDB_PORT" >&2
            exit 64
          fi
          if [[ ! -r "$1" ]]; then
            echo "ROM is not readable: $1" >&2
            exit 66
          fi
          if [[ ! "$2" =~ ^[0-9]+$ ]] || (( "$2" < 1024 || "$2" > 65535 )); then
            echo "ARM9_GDB_PORT must be an integer from 1024 through 65535" >&2
            exit 64
          fi
          bundle_root="$(cd "$(dirname "$0")" && pwd)"
          plist="$bundle_root/DeSmuME Debug.app/Contents/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          binary="$bundle_root/DeSmuME Debug.app/Contents/MacOS/$executable"
          test -x "$binary"
          exec env RE_MCP_ARM9_GDB_PORT="$2" "$binary" "$1"
          SCRIPT
          chmod +x "$root/run-desmume-debug.command"

          inspection_binary=/tmp/desmume-catalina-inspection-binary
          cp "$binary" "$inspection_binary"
          chmod +x "$inspection_binary"

          file "$binary" | tee /tmp/desmume-binary.txt
          architectures="$(lipo -archs "$inspection_binary")"
          printf '%s\n' "$architectures" | tee /tmp/desmume-architectures.txt
          [[ "$architectures" == "x86_64" ]]
          otool -L "$inspection_binary" | tee /tmp/desmume-dependencies.txt
          otool -l "$inspection_binary" > /tmp/desmume-load-commands.txt

          python3 - "$inspection_binary" <<'PY' | tee /tmp/desmume-minos.txt
          import re
          import subprocess
          import sys
          output = subprocess.check_output(["otool", "-l", sys.argv[1]], text=True)
          modern = re.search(r"cmd LC_BUILD_VERSION.*?minos ([0-9.]+).*?sdk ([0-9.]+)", output, re.DOTALL)
          legacy = re.search(r"cmd LC_VERSION_MIN_MACOSX.*?version ([0-9.]+).*?sdk ([0-9.]+)", output, re.DOTALL)
          match = modern or legacy
          if match is None:
              raise SystemExit("No macOS minimum-version load command found")
          minimum, sdk = match.groups()
          print(f"minimum_macos={minimum}")
          print(f"sdk={sdk}")
          if tuple(int(part) for part in minimum.split(".")) > (10, 15):
              raise SystemExit(f"Binary requires macOS {minimum}, later than Catalina 10.15")
          PY

          cat > "$root/README.txt" <<'TXT'
          Intel x86_64 DeSmuME Cocoa dev+ build targeting macOS Catalina 10.15.
          The Metal frontend is disabled and DeSmuME's built-in OpenGL paths are used.

          Launch:
            ./run-desmume-debug.command /absolute/path/to/game.nds 20000
          TXT

          {
            echo "DeSmuME source commit: $(cat /tmp/desmume-source-commit.txt)"
            echo "Backend: OpenGL (ENABLE_APPLE_METAL undefined)"
            cat /tmp/desmume-selection.env
            cat /tmp/desmume-binary.txt
            echo "architectures=$(cat /tmp/desmume-architectures.txt)"
            cat /tmp/desmume-minos.txt
            cat /tmp/desmume-dependencies.txt
          } > "$root/compatibility-report.txt"

          (
            cd "$root"
            shasum -a 256 "DeSmuME Debug.app/Contents/MacOS/$executable" \
              run-desmume-debug.command compatibility-report.txt README.txt \
              > SHA256SUMS.txt
          )

          ditto -c -k --sequesterRsrc --keepParent \
            "$root" /tmp/desmume-catalina-native-debug.zip
          shasum -a 256 /tmp/desmume-catalina-native-debug.zip \
            | tee /tmp/desmume-catalina-native-debug.zip.sha256

      - name: Upload bundle and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desmume-catalina-native-debug-bundle
          path: |
            /tmp/desmume-catalina-native-debug.zip
            /tmp/desmume-catalina-native-debug.zip.sha256
            /tmp/desmume-source-commit.txt
            /tmp/xcode-discovery.txt
            /tmp/desmume-selection.env
            /tmp/desmume-build.log
            /tmp/desmume-build-errors.txt
            /tmp/desmume-binary.txt
            /tmp/desmume-architectures.txt
            /tmp/desmume-dependencies.txt
            /tmp/desmume-load-commands.txt
            /tmp/desmume-minos.txt
          if-no-files-found: warn
          retention-days: 30
