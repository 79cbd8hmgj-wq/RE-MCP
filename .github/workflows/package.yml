name: Package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and verify source
        run: |
          npm install
          npm run check
          npm run build
      - name: Assemble and smoke-test self-contained bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          root="/tmp/re-mcp-${version}"
          mkdir -p "$root/dist" "$root/.github" "$root/docs" "$root/configs" "$root/benchmarks"
          cp package.json README.md mcp-config.example.json "$root/"
          cp -R .vscode "$root/"
          cp -R .continue "$root/"
          cp .github/copilot-instructions.md "$root/.github/"
          cp docs/github-copilot-agent.md docs/controller-fallback.md docs/controller-benchmark.md "$root/docs/"
          cp -R configs/controller "$root/configs/"
          cp -R benchmarks/controller "$root/benchmarks/"
          cp -R scripts "$root/"
          cp -R resources "$root/"
          cp -R dist/src/. "$root/dist/"
          (
            cd "$root"
            npm install --omit=dev --ignore-scripts
            node scripts/check-install.mjs .
            node scripts/check-ghidra-inspection-install.mjs .
            node scripts/check-nds-mutation-install.mjs .
            node scripts/check-copilot-mcp-install.mjs .
            node scripts/check-controller-checkpoint-install.mjs .
            node scripts/check-controller-fallback-install.mjs .
            node scripts/check-controller-benchmark-install.mjs .
          )
          tar -C /tmp -czf "/tmp/re-mcp-${version}.tar.gz" "re-mcp-${version}"
          sha256sum "/tmp/re-mcp-${version}.tar.gz" > "/tmp/re-mcp-${version}.tar.gz.sha256"
          printf '%s\n' "$version" > /tmp/re-mcp-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: re-mcp-downloadable-bundle
          path: |
            /tmp/re-mcp-*.tar.gz
            /tmp/re-mcp-*.tar.gz.sha256
            /tmp/re-mcp-version.txt
          if-no-files-found: error
          retention-days: 30
