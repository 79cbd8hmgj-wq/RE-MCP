name: Build DeSmuME Catalina Debug Bundle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned DeSmuME source
        run: |
          git clone --depth 1 --branch release_0_9_13 \
            https://github.com/TASEmulators/desmume.git /tmp/desmume
      - name: Add RE-MCP ARM9 autostart hook
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/desmume/desmume/src/frontend/cocoa/userinterface/appDelegate.mm')
          text = path.read_text(encoding='utf-8')
          signature = '- (void)applicationDidFinishLaunching:(NSNotification *)aNotification\n{'
          start = text.index(signature)
          anchor = '\tEmuControllerDelegate *emuControl = (EmuControllerDelegate *)[emuControlController content];\n'
          position = text.index(anchor, start) + len(anchor)
          hook = r'''
#if defined(GDB_STUB)
	NSString *reMcpPortString = [[[NSProcessInfo processInfo] environment] objectForKey:@"RE_MCP_ARM9_GDB_PORT"];
	if (reMcpPortString != nil && [reMcpPortString length] > 0)
	{
		const NSInteger reMcpPort = [reMcpPortString integerValue];
		if (reMcpPort >= 1024 && reMcpPort <= 65535)
		{
			CocoaDSCore *reMcpCore = (CocoaDSCore *)[cdsCoreController content];
			ClientExecutionControl *reMcpExecControl = [reMcpCore execControl];
			reMcpExecControl->SetGDBStubARM9Enabled(true);
			reMcpExecControl->SetGDBStubARM9Port((uint16_t)reMcpPort);
			reMcpExecControl->SetIsGDBStubStarted(true);
		}
	}
#endif
'''
          text = text[:position] + hook + text[position:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Discover Xcode projects and schemes
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/desmume -name '*.xcodeproj' -print | tee /tmp/xcode-projects.txt
          while IFS= read -r project; do
            echo "===== $project ====="
            xcodebuild -project "$project" -list
          done < /tmp/xcode-projects.txt | tee /tmp/xcode-discovery.txt
      - name: Build Intel dev+ application for Catalina
        shell: bash
        run: |
          set -euo pipefail
          project="$(grep -E 'DeSmuME.*\.xcodeproj$' /tmp/xcode-projects.txt | head -n1)"
          if [[ -z "$project" ]]; then
            echo 'No DeSmuME Xcode project discovered' >&2
            exit 1
          fi
          schemes="$(xcodebuild -project "$project" -list 2>/dev/null | sed -n '/Schemes:/,$p')"
          scheme="$(printf '%s\n' "$schemes" | grep -E 'dev\+|Dev\+' | sed 's/^[[:space:]]*//' | head -n1)"
          if [[ -z "$scheme" ]]; then
            echo 'No dev+ scheme discovered' >&2
            printf '%s\n' "$schemes" >&2
            exit 1
          fi
          echo "Project: $project"
          echo "Scheme: $scheme"
          xcodebuild \
            -project "$project" \
            -scheme "$scheme" \
            -configuration Release \
            -derivedDataPath /tmp/desmume-derived \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=10.15 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/desmume-build.log
      - name: Assemble Catalina bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$(find /tmp/desmume-derived -type d -name 'DeSmuME*.app' | head -n1)"
          if [[ -z "$app" ]]; then
            echo 'Built DeSmuME application not found' >&2
            exit 1
          fi
          root=/tmp/desmume-catalina-debug
          mkdir -p "$root"
          cp -R "$app" "$root/DeSmuME Debug.app"
          cat > "$root/run-desmume-debug.command" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          if [[ $# -ne 2 ]]; then
            echo "usage: $0 /absolute/path/to/game.nds ARM9_GDB_PORT" >&2
            exit 64
          fi
          app_dir="$(cd "$(dirname "$0")" && pwd)"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_dir/DeSmuME Debug.app/Contents/Info.plist")"
          exec env RE_MCP_ARM9_GDB_PORT="$2" \
            "$app_dir/DeSmuME Debug.app/Contents/MacOS/$executable" "$1"
          SCRIPT
          chmod +x "$root/run-desmume-debug.command"
          printf '%s\n' \
            'Intel x86_64 DeSmuME dev+ build targeting macOS 10.15.' \
            'The launcher starts the ARM9 GDB stub automatically from its second argument.' \
            'RE-MCP mode: macos-cocoa.' \
            > "$root/README.txt"
          ditto -c -k --sequesterRsrc --keepParent "$root" /tmp/desmume-catalina-debug.zip
          shasum -a 256 /tmp/desmume-catalina-debug.zip > /tmp/desmume-catalina-debug.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: desmume-catalina-debug-bundle
          path: |
            /tmp/desmume-catalina-debug.zip
            /tmp/desmume-catalina-debug.zip.sha256
            /tmp/xcode-discovery.txt
            /tmp/desmume-build.log
          if-no-files-found: error
          retention-days: 30
