name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - foundation/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Tests A-M
        run: node --import tsx --test tests/[a-m]*.test.ts
      - name: Tests N-Z
        run: node --import tsx --test tests/[n-z]*.test.ts
      - name: Full test suite
        run: npm test
      - name: Build
        run: npm run build
