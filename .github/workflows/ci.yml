name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - foundation/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Capability profile regression tests
        run: node --test --import tsx tests/tool-profiles.test.ts
      - name: Orchestration context regression tests
        run: node --test --import tsx tests/re-orchestration.test.ts
      - name: Resume evidence regression tests
        run: node --test --import tsx tests/re-decompile-resume.test.ts
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
