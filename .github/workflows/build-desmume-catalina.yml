name: Build DeSmuME Catalina Debug Bundle

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone and patch pinned DeSmuME source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release_0_9_13 \
            https://github.com/TASEmulators/desmume.git /tmp/desmume
          python3 scripts/patch-desmume-catalina.py /tmp/desmume
      - name: Discover Xcode project and dev+ scheme
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/desmume -name '*.xcodeproj' -print > /tmp/xcode-projects.txt
          : > /tmp/xcode-discovery.txt
          : > /tmp/desmume-selection.env
          while IFS= read -r project; do
            echo "===== $project =====" | tee -a /tmp/xcode-discovery.txt
            listing="$(xcodebuild -project "$project" -list 2>&1)"
            printf '%s\n' "$listing" | tee -a /tmp/xcode-discovery.txt
            scheme="$(printf '%s\n' "$listing" | sed -n '/Schemes:/,$p' | grep -E 'dev\+|Dev\+' | sed 's/^[[:space:]]*//' | head -n1 || true)"
            if [[ -n "$scheme" && ! -s /tmp/desmume-selection.env ]]; then
              printf 'PROJECT=%q\nSCHEME=%q\n' "$project" "$scheme" > /tmp/desmume-selection.env
            fi
          done < /tmp/xcode-projects.txt
          if [[ ! -s /tmp/desmume-selection.env ]]; then
            echo 'No DeSmuME dev+ scheme discovered' >&2
            exit 1
          fi
          cat /tmp/desmume-selection.env
      - name: Build Intel dev+ application for Catalina
        shell: bash
        run: |
          set -uo pipefail
          source /tmp/desmume-selection.env
          set +e
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath /tmp/desmume-derived \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            MACOSX_DEPLOYMENT_TARGET=10.15 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/desmume-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            echo '===== Xcode failure summary ====='
            grep -nE '(^|[[:space:]])(error:|fatal error:)|BUILD FAILED|CompileC|Ld ' \
              /tmp/desmume-build.log | tail -n 250 | tee /tmp/desmume-build-errors.txt || true
            exit "$status"
          fi
      - name: Assemble and inspect Catalina bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$(find /tmp/desmume-derived -type d -name 'DeSmuME*.app' | head -n1)"
          test -n "$app"

          root=/tmp/desmume-catalina-debug
          mkdir -p "$root"
          cp -R "$app" "$root/DeSmuME Debug.app"

          info_plist="$root/DeSmuME Debug.app/Contents/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$info_plist")"
          binary="$root/DeSmuME Debug.app/Contents/MacOS/$executable"
          test -x "$binary"

          cat > "$root/run-desmume-debug.command" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          if [[ $# -ne 2 ]]; then
            echo "usage: $0 /absolute/path/to/game.nds ARM9_GDB_PORT" >&2
            exit 64
          fi
          if [[ ! "$2" =~ ^[0-9]+$ ]] || (( "$2" < 1024 || "$2" > 65535 )); then
            echo "ARM9_GDB_PORT must be an integer from 1024 through 65535" >&2
            exit 64
          fi
          app_dir="$(cd "$(dirname "$0")" && pwd)"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_dir/DeSmuME Debug.app/Contents/Info.plist")"
          exec env RE_MCP_ARM9_GDB_PORT="$2" \
            "$app_dir/DeSmuME Debug.app/Contents/MacOS/$executable" "$1"
          SCRIPT
          chmod +x "$root/run-desmume-debug.command"

          file "$binary" | tee /tmp/desmume-binary.txt
          architectures="$(lipo -archs "$binary")"
          printf '%s\n' "$architectures" | tee /tmp/desmume-architectures.txt
          if [[ "$architectures" != "x86_64" ]]; then
            echo "Expected an x86_64-only binary, found: $architectures" >&2
            exit 1
          fi

          otool -l "$binary" > /tmp/desmume-load-commands.txt
          python3 - "$binary" <<'PY' | tee /tmp/desmume-minos.txt
          from __future__ import annotations

          import re
          import subprocess
          import sys

          binary = sys.argv[1]
          output = subprocess.check_output(["otool", "-l", binary], text=True)
          modern = re.search(
              r"cmd LC_BUILD_VERSION.*?minos ([0-9.]+).*?sdk ([0-9.]+)",
              output,
              re.DOTALL,
          )
          legacy = re.search(
              r"cmd LC_VERSION_MIN_MACOSX.*?version ([0-9.]+).*?sdk ([0-9.]+)",
              output,
              re.DOTALL,
          )
          match = modern or legacy
          if match is None:
              raise SystemExit("No macOS minimum-version load command found")
          minimum, sdk = match.groups()
          print(f"minimum_macos={minimum}")
          print(f"sdk={sdk}")
          if tuple(map(int, minimum.split("."))) > (10, 15):
              raise SystemExit(f"Binary requires macOS {minimum}, later than Catalina 10.15")
          PY

          grep -R -q 'RE_MCP_ARM9_GDB_PORT' \
            /tmp/desmume/desmume/src/frontend/cocoa/userinterface/appDelegate.mm
          grep -q 'RE_MCP_ARM9_GDB_PORT' "$root/run-desmume-debug.command"

          printf '%s\n' \
            'Intel x86_64 DeSmuME dev+ build targeting macOS 10.15.' \
            'The launcher automatically starts the ARM9 GDB stub.' \
            'Use RE-MCP desmume_start with mode macos-cocoa.' \
            > "$root/README.txt"
          ditto -c -k --sequesterRsrc --keepParent "$root" /tmp/desmume-catalina-debug.zip
          shasum -a 256 /tmp/desmume-catalina-debug.zip > /tmp/desmume-catalina-debug.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desmume-catalina-debug-bundle
          path: |
            /tmp/desmume-catalina-debug.zip
            /tmp/desmume-catalina-debug.zip.sha256
            /tmp/xcode-discovery.txt
            /tmp/desmume-selection.env
            /tmp/desmume-build.log
            /tmp/desmume-build-errors.txt
            /tmp/desmume-binary.txt
            /tmp/desmume-architectures.txt
            /tmp/desmume-minos.txt
            /tmp/desmume-load-commands.txt
          if-no-files-found: warn
          retention-days: 30
